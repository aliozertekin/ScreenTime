# OPTIONAL. The project does not depend on this workflow: releases are built locally with
# ./scripts/build-windows.sh (see docs/RELEASING.md). This only runs the same script on a hosted
# Linux runner and, if available, smoke-tests the installer on a real Windows runner.
name: windows
permissions:
  contents: read
on:
  workflow_dispatch:
  push:
    branches: [main]      # every push to main builds downloadable artifacts (Actions run page -> Artifacts)
    tags: ["v*"]          # a tag like v1.4.0 additionally creates a draft GitHub Release with the files attached
  pull_request:
    paths: ["packaging/windows/**", "scripts/build-windows.sh", "screentime/platform/**", ".github/workflows/windows.yml"]

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-gi python3-psutil python3-cryptography python3-pytest gir1.2-glib-2.0 python3-cairo zstd librsvg2-bin imagemagick python3-pefile shellcheck
      - run: python3 -m pytest -q

  build:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y podman
      - run: ./scripts/build-windows.sh --non-interactive --engine podman
      # .exe and .zip are already compressed: store them as-is (compression-level 0) instead of deflating ~120 MB
      # twice, which made every upload and download slower. Two artifacts so the Windows smoke job only fetches
      # the installer (~half the bytes).
      - uses: actions/upload-artifact@v4
        with:
          name: screentime-windows-installer
          path: dist/ScreenTime-*-setup.exe
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: screentime-windows-portable
          path: |
            dist/ScreenTime-*-portable.zip
            dist/SHA256SUMS
            dist/build-manifest.txt
          compression-level: 0
          if-no-files-found: error

  smoke-on-windows:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 30          # a hung step must fail in minutes, not after GitHub's 6-hour default
    steps:
      - uses: actions/checkout@v4
      # Artifact downloads occasionally stall on the storage backend. Bound each attempt and try twice.
      - id: dl1
        uses: actions/download-artifact@v4
        timeout-minutes: 4
        continue-on-error: true
        with: { name: screentime-windows-installer, path: dist }
      - if: steps.dl1.outcome != 'success'
        uses: actions/download-artifact@v4
        timeout-minutes: 4
        with: { name: screentime-windows-installer, path: dist }
      - shell: pwsh
        timeout-minutes: 20
        run: |
          # -Recurse: tolerate any artifact-directory nesting. List dist BEFORE Write-Error, because pwsh steps run
          # with $ErrorActionPreference = 'stop' and Write-Error would end the step before the listing printed.
          $setupFile = Get-ChildItem -Path dist -Recurse -File -Filter 'ScreenTime-*-setup.exe' -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($null -eq $setupFile) {
            Write-Host "Contents of dist:"
            Get-ChildItem -Path dist -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
            Write-Error "ScreenTime installer was not found in the downloaded artifact."
            exit 1
          }
          Write-Host "Using installer: $($setupFile.FullName)"
          ./packaging/windows/smoke.ps1 -Mode Installer -Setup $setupFile.FullName

  # Tag push (vX.Y.Z) -> DRAFT release with the installer, portable zip and checksums attached.
  # Publish the draft after you have tried the installer; change --draft to publish immediately if you prefer.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        timeout-minutes: 5
        with: { pattern: "screentime-windows-*", path: dist, merge-multiple: true }
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          grep -q "^version=${version}$" dist/build-manifest.txt || { echo "tag ${GITHUB_REF_NAME} does not match the built version:"; cat dist/build-manifest.txt; exit 1; }
          awk -v v="$version" '/^## /{p = index($0, "## " v " ") == 1} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "ScreenTime ${version}" > notes.md
          assets=(dist/ScreenTime-"${version}"-setup.exe dist/ScreenTime-"${version}"-portable.zip dist/SHA256SUMS dist/build-manifest.txt)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --draft --title "ScreenTime ${version}" --notes-file notes.md
          fi
